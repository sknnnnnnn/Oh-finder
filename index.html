<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f7f70"><title>OKJ Member Finder</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><header><div class="eyebrow">OKJ MEMBER FINDER</div><h1>ค้นหาสมาชิก</h1><p>เบอร์โทร → เลขสมาชิก → QR</p></header>
<section id="loginCard" class="card"><label>รหัสพนักงาน</label><input id="username" autocomplete="username" inputmode="numeric" placeholder="รหัสพนักงาน"><label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" placeholder="รหัสผ่าน"><button id="loginBtn">เข้าสู่ระบบ</button><div id="loginMsg" class="msg"></div></section>
<section id="searchCard" class="card hidden"><label>เบอร์โทรสมาชิก</label><input id="phone" inputmode="tel" maxlength="12" placeholder="08x-xxx-xxxx"><button id="searchBtn">ค้นหา</button><div id="searchMsg" class="msg"></div></section>
<section id="resultCard" class="card result hidden"><small>ชื่อสมาชิก</small><div id="memberName" class="name">-</div><small>เลขสมาชิก</small><div id="memberCode" class="code">-</div><img id="qr" class="qr" alt="QR สมาชิก"><button id="againBtn">ค้นหาเบอร์อื่น</button><button id="logoutBtn" class="secondary">ออกจากระบบ</button></section>
<footer>ไม่บันทึกรหัสผ่าน</footer></main><script src="/app.js"></script></body></html>
